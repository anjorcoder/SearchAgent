<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stakeholder Monitor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Funnel+Display:wght@400;500;600&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* Thema afgeleid van de huisstijl van de bestaande website */
  :root {
    --black:#091a00; --green-dark:#063c2a; --green:#026447; --lime:#8CF458; --lime-light:#E5FFD0;
    --blue-light:#bde8ff; --cream-light:#FFFCF6; --white:#fff; --grey:#666666; --grey-light:#F0EFEB;
    --line:#E6E4DE; --line-strong:#BDBDBD; --danger:#a71917;
    --radius-sm:.75rem; --radius-md:1rem; --radius-lg:1.5rem;
    --gutter:clamp(1rem,3vw,2.5rem);
    --display:'Funnel Display',system-ui,sans-serif;
  }
  * { box-sizing:border-box; }
  html { background:var(--cream-light); }
  body { margin:0; min-height:100vh; overflow-x:clip; color:var(--black); background:var(--cream-light);
    font:16px/1.6 'Hanken Grotesk',system-ui,Segoe UI,sans-serif; -webkit-font-smoothing:antialiased; }
  a { color:inherit; }
  h1, h2, h3 { margin:0; font-family:var(--display); font-weight:500; letter-spacing:-.02em; }
  .wrap { width:100%; padding-left:var(--gutter); padding-right:var(--gutter); }
  .meta { color:var(--grey); font-size:.88rem; }
  .error { color:var(--danger); font-size:.88rem; }

  /* -- controls -- */
  input { height:48px; padding:0 14px; border:1px solid var(--line-strong); border-radius:.5rem; background:var(--white); color:var(--black); font:inherit; width:100%; }
  input::placeholder { color:var(--grey); }
  input:focus { outline:none; border-color:var(--green); box-shadow:0 0 0 3px var(--lime-light); }
  button { height:48px; padding:0 20px; border:0; border-radius:.5rem; font:inherit; font-weight:600; cursor:pointer; white-space:nowrap;
    display:inline-flex; align-items:center; justify-content:center; gap:.5em; transition:background .15s, color .15s, border-color .15s, opacity .15s; }
  button:disabled { opacity:.55; cursor:wait; }
  /* -- expanderende pijlknop: lime blok schuift bij hover/focus over de hele knop -- */
  .xbtn { --h:64px; --pad:6px; --acc:52px; --r:22px; --ar:16px;
    position:relative; justify-content:flex-start; height:var(--h); min-width:288px; padding:var(--pad); border-radius:var(--r);
    background:var(--black); color:var(--white); overflow:hidden; user-select:none; transition:transform .25s cubic-bezier(.3,1.5,.5,1), opacity .15s; }
  .xbtn.sm { --h:48px; --pad:4px; --acc:40px; --r:14px; --ar:10px; min-width:200px; }
  .xbtn:focus-visible { outline:2px solid var(--lime); outline-offset:2px; }
  .xbtn:active:not(:disabled) { transform:scale(.97); }
  .xbtn:disabled { opacity:.5; }
  .xbtn-accent { position:absolute; top:var(--pad); bottom:var(--pad); left:var(--pad); z-index:1; width:var(--acc); border-radius:var(--ar);
    background:var(--lime); color:#0a0a0a; overflow:hidden; transition:width .5s cubic-bezier(.25,1.15,.4,1); }
  .xbtn-one { position:absolute; inset:0; display:grid; place-items:center; transition:opacity .1s; }
  .xbtn-many { position:absolute; inset:0; display:flex; align-items:center; justify-content:space-around; padding:0 12px; }
  .xbtn-many > span { display:inline-grid; place-items:center; opacity:0; transform:translateX(-6px); transition:opacity .18s cubic-bezier(.2,.7,.2,1), transform .18s cubic-bezier(.2,.7,.2,1); }
  .xbtn-many svg { opacity:var(--o); }
  .xbtn svg { width:20px; height:28px; }
  .xbtn.sm svg { width:15px; height:21px; }
  .xbtn-label { position:relative; z-index:0; margin-left:calc(var(--acc) + 24px); margin-right:20px; white-space:nowrap;
    font-size:1.125rem; font-weight:500; letter-spacing:-.02em; transition:opacity .12s, transform .12s; }
  .xbtn.sm .xbtn-label { font-size:1rem; margin-left:calc(var(--acc) + 18px); }
  .xbtn.is-active:not(:disabled) .xbtn-accent { width:calc(100% - 2 * var(--pad)); }
  .xbtn.is-active:not(:disabled) .xbtn-one { opacity:0; }
  .xbtn.is-active:not(:disabled) .xbtn-many > span { opacity:1; transform:none; transition-delay:calc(.04s + var(--i) * .025s); }
  .xbtn.is-active:not(:disabled) .xbtn-label { opacity:0; transform:translateX(6px); }
  @media (prefers-reduced-motion: reduce) { .xbtn, .xbtn * { transition-duration:0s !important; transition-delay:0s !important; } }
  .btn-secondary { background:var(--white); color:var(--black); border:1px solid var(--line-strong); }
  .btn-secondary:hover:not(:disabled) { border-color:var(--black); }
  :focus-visible { outline:2px solid var(--green); outline-offset:2px; }

  /* -- cards -- */
  .card { background:var(--white); border:1px solid var(--line); border-radius:var(--radius-md); padding:28px; }
  .card h3 { font-size:1.2rem; color:var(--green-dark); margin-bottom:16px; }
  .grid { columns:340px; column-gap:20px; }
  .grid > * { break-inside:avoid; margin-bottom:20px; display:block; }
  /* -- lichtgroene vlakken op de profielpagina (huisstijl: label in kader + display-kop) -- */
  .tile { background:var(--lime-light); border:0; border-radius:var(--radius-md); padding:clamp(1.75rem,3vw,3rem); font-size:1.0625rem; line-height:1.65; }
  .eyebrow { display:inline-block; border:1px solid var(--black); border-radius:.25rem; padding:2px 10px; margin-bottom:16px;
    font-size:.74rem; font-weight:600; letter-spacing:.08em; text-transform:uppercase; }
  .tile-title { font-family:var(--display); font-weight:400; font-size:clamp(1.6rem,2.4vw,2.1rem); line-height:1.15; color:var(--green-dark); margin:0 0 20px; }
  .tile .li-sub, .tile .meta { color:rgba(9,26,0,.66); }
  .tile ul.bullets li::before { background:var(--green-dark); }
  .add-form .xbtn { min-width:0; width:100%; }
  .section-head { display:flex; align-items:baseline; justify-content:space-between; gap:16px; margin:72px 0 24px; }
  .section-head h2 { font-size:clamp(1.6rem,2.6vw,2.4rem); color:var(--green-dark); }
  .fade { opacity:0; transform:translateY(8px); animation:fadeUp .45s cubic-bezier(.2,.7,.2,1) forwards; }
  @keyframes fadeUp { to { opacity:1; transform:none; } }
  @media (prefers-reduced-motion: reduce) { .fade { animation:none; opacity:1; transform:none; } }

  /* -- hero met gebogen fotorij -- */
  .hero-outer { padding-top:var(--gutter); }
  .hero-band { position:relative; overflow:hidden; container-type:size; height:clamp(480px,72vh,700px); background:var(--green-dark); border-radius:var(--radius-lg); }
  .hero-band .band { position:absolute; inset:0; pointer-events:none; opacity:0; transition:opacity .5s; }
  .hero-band .slice { position:absolute; top:0; overflow:hidden; background:var(--green); }
  .hero-band .slice img { position:absolute; top:0; max-width:none; object-fit:cover; }
  .hero-copy { position:relative; z-index:1; height:100%; display:flex; flex-direction:column; align-items:center; justify-content:space-between; text-align:center; padding:56px 24px 44px; color:var(--white); }
  .hero-copy h1 { font-size:clamp(2.4rem,5.6vw,5rem); line-height:1.02; font-weight:400; letter-spacing:-.035em; text-wrap:balance; }
  .hero-copy h1 span { color:var(--lime); }
  .hero-copy p { max-width:460px; margin:0 auto; color:rgba(255,255,255,.78); text-wrap:balance; }
  .hero-copy .xbtn { margin-top:20px; }

  /* -- toevoegen + stakeholderkaarten -- */
  .add-form { display:grid; gap:12px; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); padding:20px; }
  .people { display:grid; gap:20px; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); }
  .person { position:relative; display:flex; flex-direction:column; overflow:hidden; padding:0; text-decoration:none; transition:box-shadow .2s, transform .2s; }
  .person:hover { transform:translateY(-3px); box-shadow:6px 6px 0 0 var(--green-dark); }
  .person .photo { position:relative; aspect-ratio:4/5; background:var(--lime-light); overflow:hidden; }
  .person .photo img { width:100%; height:100%; object-fit:cover; object-position:center 20%; display:block; transition:transform .5s; }
  .person:hover .photo img { transform:scale(1.03); }
  .person .initials { position:absolute; inset:0; display:grid; place-items:center; font-family:var(--display); font-size:3.6rem; color:var(--green); background:var(--lime-light); }
  .person .body { padding:18px 20px 20px; display:flex; flex-direction:column; gap:2px; flex:1; }
  .person h2 { font-size:1.35rem; color:var(--green-dark); }
  .person .latest { margin-top:10px; padding-top:12px; border-top:1px solid var(--line); font-size:.86rem; color:var(--grey); display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .person .del { position:absolute; top:12px; right:12px; z-index:2; height:34px; padding:0 12px; font-size:.8rem; background:var(--white); color:var(--black); border:1px solid var(--line); opacity:0; transition:opacity .15s; }
  .person:hover .del, .person .del:focus-visible { opacity:1; }
  .person .del:hover { color:var(--danger); border-color:var(--danger); }
  .empty { color:var(--grey); padding:48px 0; text-align:center; border:1px dashed var(--line-strong); border-radius:var(--radius-md); background:var(--white); }
  @media (hover: none) { .person .del { opacity:1; } }

  /* -- bullets -- */
  ul.bullets { list-style:none; margin:0; padding:0; display:grid; gap:14px; }
  ul.bullets li { position:relative; padding-left:20px; }
  ul.bullets li::before { content:''; position:absolute; left:0; top:.6em; width:7px; height:7px; border-radius:50%; background:var(--green); }
  .li-title { font-weight:600; }
  .li-sub { color:var(--grey); font-size:.9rem; }
  a.src { color:var(--green); font-size:.82rem; font-weight:600; text-decoration:none; white-space:nowrap; }
  a.src:hover { text-decoration:underline; }

  /* -- profielpagina -- */
  main.page { padding-top:28px; padding-bottom:96px; }
  .back { color:var(--green); font-weight:600; text-decoration:none; font-size:.92rem; }
  .back:hover { text-decoration:underline; }
  .profile-hero { display:flex; gap:clamp(24px,4vw,64px); align-items:center; margin-top:20px; padding:clamp(28px,5vw,64px);
    background:var(--green-dark); color:var(--white); border:0; border-radius:var(--radius-lg); }
  .avatar { border-radius:50%; flex:none; object-fit:cover; object-position:center 20%; background:var(--lime-light); display:grid; place-items:center;
    color:var(--green); font-family:var(--display); border:4px solid var(--lime); }
  .avatar-col { display:flex; flex-direction:column; align-items:center; gap:10px; flex:none; text-align:center; }
  .photo-btn { height:36px; padding:0 14px; font-size:.85rem; background:transparent; color:var(--lime); border:1px solid rgba(140,244,88,.5); border-radius:999px; }
  .photo-btn:hover:not(:disabled) { border-color:var(--lime); }
  .photo-msg { font-size:.8rem; color:rgba(255,255,255,.65); max-width:180px; }
  .profile-hero h1 { font-size:clamp(2.4rem,5vw,4.4rem); line-height:1.02; font-weight:400; letter-spacing:-.035em; }
  .profile-hero .role { font-family:var(--display); font-size:clamp(1.1rem,1.9vw,1.45rem); color:var(--lime); margin-top:10px; }
  .profile-hero .intro { color:rgba(255,255,255,.8); max-width:780px; margin:16px 0 0; }
  .hero-actions { display:flex; gap:12px; flex-wrap:wrap; margin-top:28px; align-items:flex-start; }
  .action { display:flex; flex-direction:column; gap:6px; }
  .profile-hero .meta { color:rgba(255,255,255,.65); }
  .profile-hero .error { color:#ffb4a8; }
  .profile-hero .btn-secondary { background:transparent; color:var(--white); border-color:rgba(255,255,255,.4); }
  .profile-hero .btn-secondary:hover:not(:disabled) { border-color:var(--white); }
  .chip { display:inline-flex; align-items:center; gap:8px; color:var(--lime); font-size:.85rem; font-weight:600; }
  .chip::before { content:''; width:8px; height:8px; border-radius:50%; background:var(--lime); animation:pulse 1s ease-in-out infinite alternate; }
  @keyframes pulse { from { opacity:.25; } to { opacity:1; } }

  .featured { cursor:pointer; transition:box-shadow .2s, transform .2s; }
  .featured:hover { transform:translateY(-2px); box-shadow:6px 6px 0 0 var(--green-dark); }
  .featured .tile-title { font-size:clamp(1.8rem,3vw,2.6rem); max-width:900px; margin-bottom:12px; }
  .featured p { margin:0; max-width:820px; }
  .featured .more { margin-top:18px; font-weight:600; color:var(--green-dark); }
  .tag { display:inline-block; background:var(--blue-light); color:var(--black); border-radius:.4rem; padding:2px 10px; font-size:.75rem; font-weight:600; text-transform:capitalize; }

  /* -- tijdlijn -- */
  .timeline { overflow-x:auto; padding:36px 8px 20px; }
  .tl-track { position:relative; display:flex; justify-content:space-between; min-width:100%; padding:0 24px; }
  .tl-track::before { content:''; position:absolute; left:0; right:0; top:9px; height:2px; background:var(--green); opacity:.35; }
  .tl-item { position:relative; display:flex; flex-direction:column; align-items:center; gap:12px; min-width:96px; height:auto; background:none; color:var(--grey); padding:0; font-weight:600; font-size:.78rem; }
  .tl-item:hover { color:var(--black); }
  .tl-dot { width:20px; height:20px; border-radius:50%; background:var(--white); border:3px solid var(--green); transition:transform .2s, background .2s; }
  .tl-item:hover .tl-dot, .tl-item:focus-visible .tl-dot { transform:scale(1.25); background:var(--green); }
  .tl-item.latest .tl-dot { background:var(--lime); border-color:var(--green-dark); }
  .tl-item.new .tl-date::after { content:' • nieuw'; color:var(--green); }

  .popup { position:fixed; z-index:20; width:310px; pointer-events:none; opacity:0; transform:translateY(4px); transition:opacity .15s, transform .15s;
    background:var(--white); border:1px solid var(--line); border-radius:var(--radius-sm); padding:16px 18px; box-shadow:1px 1px 10px 2px #0000000f, 0 18px 40px rgba(6,60,42,.18); }
  .popup.show { opacity:1; transform:none; }
  .popup .p-title { font-weight:600; margin:8px 0 4px; line-height:1.35; color:var(--green-dark); }
  .popup .p-text { color:var(--grey); font-size:.86rem; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
  .popup .p-hint { color:var(--green); font-size:.78rem; font-weight:600; margin-top:8px; }

  dialog { max-width:640px; width:calc(100% - 32px); border:0; border-radius:var(--radius-md); padding:32px; background:var(--white); color:var(--black); }
  dialog::backdrop { background:rgba(6,60,42,.55); backdrop-filter:blur(3px); }
  dialog h2 { font-size:1.6rem; margin:12px 0; line-height:1.25; color:var(--green-dark); }
  dialog p { margin:0 0 18px; }
  .dialog-actions { display:flex; gap:10px; justify-content:flex-end; flex-wrap:wrap; }

  .notes { margin-top:80px; }
  .notes h3 { font-size:1rem; color:var(--grey); margin-bottom:6px; }
  .notes details { border-top:1px solid var(--line); padding:14px 0; }
  .notes summary { cursor:pointer; font-weight:600; color:var(--green-dark); }
  .notes p { color:var(--grey); font-size:.9rem; margin:10px 0 0; max-width:900px; }

  @media (max-width: 720px) {
    .profile-hero { flex-direction:column; text-align:center; }
    .hero-actions { justify-content:center; }
    .xbtn { min-width:0; }
  }
</style>
</head>
<body>
<div id="view"></div>
<div class="popup" id="popup" role="tooltip"></div>
<dialog id="dlg"></dialog>
<script>
const $view = document.getElementById('view');
const $pop = document.getElementById('popup');
const $dlg = document.getElementById('dlg');
const newUrls = new Set();

function el(tag, props = {}, ...kids) {
  const e = Object.assign(document.createElement(tag), props);
  kids.flat().filter(k => k != null && k !== false && k !== '').forEach(k => e.append(k));
  return e;
}
async function api(url, opts) {
  const r = await fetch(url, opts);
  if (r.status === 204) return null;
  const data = await r.json();
  if (!r.ok) throw new Error(data.error || r.statusText);
  return data;
}
const fmt = iso => iso ? new Date(iso).toLocaleString('nl-NL', {dateStyle:'medium', timeStyle:'short'}) : 'nooit';
const MAANDEN = ['jan','feb','mrt','apr','mei','jun','jul','aug','sep','okt','nov','dec'];
function fmtDate(d) {
  const m = /^(\d{4})(?:-(\d{2}))?(?:-(\d{2}))?/.exec(d || '');
  if (!m) return 'datum onbekend';
  return [m[3] && String(+m[3]), m[2] && MAANDEN[+m[2] - 1], m[1]].filter(Boolean).join(' ');
}
function safeHref(u) { return /^https?:\/\//i.test(u) ? u : '#'; }
const src = (url, text = 'bron ↗') => el('a', {className:'src', href:safeHref(url), target:'_blank', rel:'noopener noreferrer', textContent:text});
const sub = s => [s.functie, s.organisatie].filter(Boolean).join(' · ');
const join = (...parts) => parts.filter(Boolean).join(' · ');
const fotoUrl = s => s.profiel && s.profiel.foto_url;
let delay = 0;
const fade = node => { node.classList.add('fade'); node.style.animationDelay = `${(delay++) * 50}ms`; return node; };

// Expanderende pijlknop. Actief bij hover (alleen op apparaten die kunnen hoveren) of toetsenbordfocus.
const CHEVRON = '<svg viewBox="0 0 20 28" fill="none" aria-hidden="true">' +
  [[4, 4], [10, 9], [16, 14], [10, 19], [4, 24]].map(([x, y]) => `<circle cx="${x}" cy="${y}" r="2" fill="currentColor"/>`).join('') + '</svg>';
const ARROW_OPACITY = [1, 0.78, 0.54, 0.32, 0.16];
const canHover = matchMedia('(hover: hover)').matches;
function arrowButton(label, {small = false, type = 'button'} = {}) {
  const b = el('button', {className:'xbtn' + (small ? ' sm' : ''), type});
  const accent = el('span', {className:'xbtn-accent'});
  accent.setAttribute('aria-hidden', 'true');
  accent.innerHTML = `<span class="xbtn-one">${CHEVRON}</span><span class="xbtn-many">` +
    ARROW_OPACITY.map((o, i) => `<span style="--i:${i};--o:${o}">${CHEVRON}</span>`).join('') + '</span>';
  b.append(accent, el('span', {className:'xbtn-label', textContent:label}));
  if (canHover) {
    b.addEventListener('mouseenter', () => b.classList.add('is-active'));
    b.addEventListener('mouseleave', () => { if (!b.matches(':focus-visible')) b.classList.remove('is-active'); });
  }
  b.addEventListener('focus', () => { if (b.matches(':focus-visible')) b.classList.add('is-active'); });
  b.addEventListener('blur', () => { if (!b.matches(':hover')) b.classList.remove('is-active'); });
  return b;
}

function initials(naam) {
  return naam.split(/\s+/).filter(Boolean).map(w => w[0]).filter(c => /[A-Za-zÀ-ž]/.test(c)).slice(0, 2).join('').toUpperCase() || '?';
}
// Foto die bij een laadfout vervangen wordt door de placeholder.
function photo(s, cls, placeholder, extra = {}) {
  const url = fotoUrl(s);
  if (!url) return placeholder();
  const img = el('img', {className:cls, src:safeHref(url), alt:`Foto van ${s.naam}`, referrerPolicy:'no-referrer', loading:'lazy', ...extra});
  img.onerror = () => img.replaceWith(placeholder());
  return img;
}
function avatar(s, size) {
  return photo(s, 'avatar',
    () => el('div', {className:'avatar', textContent:initials(s.naam), style:`width:${size}px;height:${size}px;font-size:${size * .34}px`}),
    {width:size, height:size});
}

/* -- gebogen fotorij ---------------------------------------------------------
 * Vanilla-versie van de "tilted grid hero": één rij beelden stroomt van rechts
 * naar links over de binnenkant van een cilinder. Elke tegel bestaat uit SLICES
 * verticale stroken die elk een eigen hoek op de cilinder krijgen; de tegel als
 * geheel draait mee met één rotateY-animatie. Alleen de vertraging per tegel
 * verschilt. JS meet de lus (ResizeObserver) en geeft een tegel een nieuw beeld
 * zodra die buiten beeld rondgaat.
 * ------------------------------------------------------------------------- */
const SLICES = 16;
const CAMERA = 1.6;
const MAX_WIDTH = 55;

function arc(bend) { return (CAMERA - 1 + Math.cos(bend)) / (2 * CAMERA * Math.sin(bend)); }

function measure(width, height, tile, aspect, gap, bend) {
  const h = Math.min((tile / 100) * height, ((MAX_WIDTH / 100) * width) / aspect);
  const radius = width * arc(bend);
  if (!(h > 0) || !(radius > 0)) return {columns:2, sweep:0, unit:0, limit:0};
  const deg = rad => (rad * 180) / Math.PI;
  const unit = deg(h / radius);
  const pitch = (aspect + gap / 100) * unit;
  const limit = deg(bend) + (aspect * unit) / 2;
  const columns = Math.min(60, Math.max(2, Math.ceil((2 * limit) / pitch)));
  const round = n => +n.toFixed(4);
  const sweep = round((columns * pitch) / 2);
  return {columns, sweep, unit:round(unit), limit:round(Math.min(sweep, limit))};
}

let rowId = 0;
function curvedRow(host, images, {speed = 4, tileHeight = 26, aspect = 16 / 9, gap = 6, axis = 56, curve = 80, fadeW = 12} = {}) {
  const id = `cr${rowId++}`, orbit = `${id}o`, tileCls = `${id}t`;
  const bend = (Math.min(85, Math.max(5, curve)) * Math.PI) / 180;
  const style = document.createElement('style');
  const band = el('div', {className:'band'});
  band.setAttribute('aria-hidden', 'true');

  const u = n => `calc(${+n.toFixed(4)} * min(${tileHeight}cqh, ${+(MAX_WIDTH / aspect).toFixed(4)}cqw))`;
  const r = 100 * arc(bend);
  const radius = `${+r.toFixed(3)}cqw`;
  const turn = d => `translateZ(${radius}) rotateY(${+d.toFixed(4)}deg) translateZ(-${radius})`;
  const mask = `linear-gradient(90deg,transparent,#000 ${fadeW}%,#000 ${100 - fadeW}%,transparent)`;
  Object.assign(band.style, {perspective:`${+(r * CAMERA).toFixed(3)}cqw`, perspectiveOrigin:`50% ${axis}%`, maskImage:mask, webkitMaskImage:mask});
  const share = aspect / SLICES;
  const pick = i => images[((i % images.length) + images.length) % images.length];

  function build({columns, sweep, unit, limit}) {
    const hide = +(((sweep - limit) / (2 * sweep || 1)) * 100).toFixed(4);
    style.textContent =
      `@keyframes ${orbit}{from{transform:${turn(-sweep)}}to{transform:${turn(sweep)}}` +
      `0%,${hide}%,${100 - hide}%,100%{visibility:hidden}` +
      `${hide + 0.001}%,${100 - hide - 0.001}%{visibility:visible}}` +
      `@media(prefers-reduced-motion:reduce){.${tileCls}{animation-play-state:paused}}`;
    const duration = columns * speed;
    const tiles = [];
    for (let t = 0; t < columns; t++) {
      const first = columns - 1 - t;  // volgorde waarin tegels in beeld komen
      const tile = el('div', {className:tileCls});
      Object.assign(tile.style, {position:'absolute', left:`calc(50% - ${u(aspect / 2)})`, top:`calc(${axis}% - ${u(0.5)})`,
        width:u(aspect), height:u(1), transformStyle:'preserve-3d', animation:`${orbit} ${duration}s linear ${-t * speed}s infinite`});
      const imgs = [];
      for (let k = 0; k < SLICES; k++) {
        const slice = el('div', {className:'slice'});
        Object.assign(slice.style, {left:u((aspect - share) / 2), width:k === SLICES - 1 ? u(share) : `calc(${u(share)} + 1px)`, height:u(1),
          transform:turn((aspect / 2 - (k + 0.5) * share) * unit)});
        if (k === 0) slice.style.borderRadius = '12px 0 0 12px';
        if (k === SLICES - 1) slice.style.borderRadius = '0 12px 12px 0';
        const img = el('img', {src:pick(first).src, alt:'', draggable:false});
        Object.assign(img.style, {left:u(-k * share), width:u(aspect), height:u(1)});
        imgs.push(img);
        slice.append(img);
        tile.append(slice);
      }
      tile.addEventListener('animationiteration', e => {
        if (e.target !== tile) return;
        const lap = Math.round(e.elapsedTime / duration);  // telt hele rondes, ook gemiste events
        const next = pick(lap * columns + first).src;
        imgs.forEach(i => { i.src = next; });
      });
      tiles.push(tile);
    }
    band.replaceChildren(...tiles);
  }

  for (const {src: s} of images) new Image().src = s;
  let layout = measure(1200, 560, tileHeight, aspect, gap, bend);
  build(layout);
  const ro = new ResizeObserver(([entry]) => {
    if (!host.isConnected) { ro.disconnect(); return; }
    const {width, height} = entry.contentRect;
    const next = measure(width, height, tileHeight, aspect, gap, bend);
    if (next.columns !== layout.columns || next.sweep !== layout.sweep || next.unit !== layout.unit) { layout = next; build(next); }
    band.style.opacity = 1;
  });
  ro.observe(host);
  host.prepend(style, band);
  return host;
}

const HERO_IMAGES = [
  '01-handshake-at-business-meeting', '03-engineers-looking-at-blueprint', '04-people-having-meeting-inside-conference-room',
  '05-engineer-holding-a-floor-plan', '02-people-shaking-hands-in-a-meeting', '08-architects-looking-at-blueprint',
  '07-meeting-inside-the-boardroom', '10-people-in-hard-hats-looking-at-a-blueprint', '06-people-doing-handshakes',
  '09-meeting-in-the-office', '11-deal-by-doing-hand-shake', '12-coworkers-in-a-board-room',
].map(n => ({src:`img/hero/${n}.jpg`}));

// -- startpagina -------------------------------------------------------------
function renderPersonCard(s) {
  const laatste = s.updates[0];
  const del = el('button', {className:'del', textContent:'Verwijderen', type:'button'});
  del.onclick = async e => {
    e.preventDefault(); e.stopPropagation();
    if (!confirm(`${s.naam} en alle bijbehorende gegevens verwijderen?`)) return;
    await api(`/api/stakeholders/${s.id}`, {method:'DELETE'});
    route();
  };
  const role = (s.profiel && s.profiel.huidige_functie) ? join(s.profiel.huidige_functie.functie, s.profiel.huidige_functie.organisatie) : sub(s);
  return fade(el('a', {className:'card person', href:`#/p/${s.id}`},
    del,
    el('div', {className:'photo'}, photo(s, '', () => el('div', {className:'initials', textContent:initials(s.naam)}))),
    el('div', {className:'body'},
      el('h2', {textContent:s.naam}),
      el('div', {className:'meta', textContent:role || 'Geen functie opgegeven'}),
      el('div', {className:'latest', textContent: laatste
        ? `${fmtDate(laatste.gepubliceerd)} — ${laatste.titel || '(zonder titel)'}`
        : (s.profiel ? 'Profiel aanwezig, nog geen updates.' : 'Nog geen profiel of updates.')}))));
}

async function renderHome() {
  const data = await api('/api/stakeholders');
  const form = el('form', {className:'card add-form'},
    el('input', {name:'naam', placeholder:'Naam *', required:true}),
    el('input', {name:'functie', placeholder:'Functie'}),
    el('input', {name:'organisatie', placeholder:'Organisatie'}),
    el('input', {name:'zoekfocus', placeholder:'Zoekfocus (bijv. projecten)'}),
    arrowButton('Toevoegen', {small:true, type:'submit'}));
  form.onsubmit = async e => {
    e.preventDefault();
    const body = Object.fromEntries(new FormData(form));
    try {
      const s = await api('/api/stakeholders', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)});
      location.hash = `#/p/${s.id}`;
    } catch (err) { alert(err.message); }
  };
  const cta = arrowButton('Stakeholder toevoegen');
  cta.onclick = () => { form.scrollIntoView({behavior:'smooth', block:'center'}); form.querySelector('input').focus({preventScroll:true}); };

  const hero = curvedRow(el('section', {className:'hero-band'},
    el('div', {className:'hero-copy'},
      el('h1', {}, 'Ken je stakeholders.', el('br'), el('span', {textContent:'Vóór elk gesprek.'})),
      el('div', {}, el('p', {textContent:'Zakelijk profiel, openbare updates en een tijdlijn per persoon. Alles met bron.'}), cta))),
    HERO_IMAGES);

  $view.replaceChildren(el('div', {className:'wrap hero-outer'}, hero), el('main', {className:'wrap page'},
    el('div', {className:'section-head', style:'margin-top:32px'}, el('h2', {textContent:'Stakeholder toevoegen'})),
    fade(form),
    el('div', {className:'section-head'}, el('h2', {textContent:'Stakeholders'}), el('span', {className:'meta', textContent:`${data.length} ${data.length === 1 ? 'persoon' : 'personen'}`})),
    data.length
      ? el('div', {className:'people'}, data.map(renderPersonCard))
      : el('div', {className:'empty', textContent:'Nog geen stakeholders. Voeg er hierboven een toe.'})));
}

// -- profielpagina -----------------------------------------------------------
function actionButton(label, primary, busyLabel, when, run) {
  const btn = primary ? arrowButton(label, {small:true}) : el('button', {className:'btn-secondary', textContent:label});
  const status = el('span', {className:'meta', textContent:when});
  const msg = el('span', {className:'error'});
  btn.onclick = async () => {
    btn.disabled = true; msg.textContent = '';
    status.replaceChildren(el('span', {className:'chip', textContent:busyLabel}));
    try { await run(); }
    catch (e) { msg.textContent = e.message; btn.disabled = false; status.textContent = when; }
  };
  return el('div', {className:'action'}, btn, status, msg);
}

const tileHead = (eyebrow, title) => [el('span', {className:'eyebrow', textContent:eyebrow}), el('h3', {className:'tile-title', textContent:title})];

function bulletCard(eyebrow, title, items, line) {
  if (!items || !items.length) return null;
  return fade(el('div', {className:'tile'}, tileHead(eyebrow, title),
    el('ul', {className:'bullets'}, items.map(i => el('li', {}, ...line(i))))));
}

function renderProfile(s) {
  const p = s.profiel;
  if (!p) return [fade(el('div', {className:'tile'}, tileHead('Profiel', 'Nog geen profiel'), el('p', {className:'meta', textContent:'Klik op "Profiel opbouwen" om het zakelijke profiel te laten zoeken.'})))];
  const h = p.huidige_functie;
  const row = (title, subline, url) => [el('div', {className:'li-title', textContent:title || ''}),
    el('div', {className:'li-sub'}, subline ? `${subline} · ` : '', src(url))];
  return [
    bulletCard('In het kort', 'Kernpunten', p.kernpunten, k => [k]),
    bulletCard('Nu', 'Huidige functie', h ? [h] : [], i => row(i.functie, join(i.organisatie, i.sinds && `sinds ${i.sinds}`), i.bron_url)),
    bulletCard('Ervaring', 'Loopbaan', p.loopbaan, i => row(i.functie, join(i.organisatie, i.periode), i.bron_url)),
    bulletCard('Achtergrond', 'Opleiding', p.opleiding, i => row(i.opleiding, join(i.instelling, i.periode), i.bron_url)),
    bulletCard('Netwerk', 'Nevenfuncties & bestuursrollen', p.nevenfuncties, i => row(i.rol, join(i.organisatie, i.periode), i.bron_url)),
    bulletCard('Standpunten', "Thema's", p.thema_s, i => row(i.thema, i.toelichting, i.bron_url)),
    bulletCard('Links', 'Online profielen', p.profielen, i => [el('a', {className:'src', style:'font-size:.98rem;white-space:normal', href:safeHref(i.url), target:'_blank', rel:'noopener noreferrer', textContent:`${i.label || i.url} ↗`})]),
  ].filter(Boolean);
}

function updateHead(u) {
  return el('div', {}, el('span', {className:'tag', textContent:u.type || 'overig'}), el('span', {className:'meta', textContent:`  ${fmtDate(u.gepubliceerd)}`}));
}

function openUpdate(u) {
  hidePopup();
  const close = el('button', {className:'btn-secondary', textContent:'Sluiten'});
  close.onclick = () => $dlg.close();
  const open = arrowButton('Open bron', {small:true});
  open.onclick = () => window.open(safeHref(u.bron_url), '_blank', 'noopener,noreferrer');
  $dlg.replaceChildren(
    updateHead(u),
    el('h2', {textContent:u.titel || '(zonder titel)'}),
    el('p', {textContent:u.samenvatting || 'Geen samenvatting.'}),
    el('p', {className:'meta', textContent:`Opgehaald ${fmt(u.opgehaald)}`}),
    el('div', {className:'dialog-actions'}, close, open));
  $dlg.showModal();
}
$dlg.addEventListener('click', e => { if (e.target === $dlg) $dlg.close(); });

function showPopup(anchor, u) {
  $pop.replaceChildren(
    updateHead(u),
    el('div', {className:'p-title', textContent:u.titel || '(zonder titel)'}),
    u.samenvatting ? el('div', {className:'p-text', textContent:u.samenvatting}) : null,
    el('div', {className:'p-hint', textContent:'Klik om te openen →'}));
  const r = anchor.getBoundingClientRect();
  const pw = $pop.offsetWidth, ph = $pop.offsetHeight;
  const x = Math.max(12, Math.min(r.left + r.width / 2 - pw / 2, innerWidth - pw - 12));
  let y = r.top - ph - 12;
  if (y < 12) y = r.bottom + 12;
  $pop.style.left = `${x}px`; $pop.style.top = `${y}px`;
  $pop.classList.add('show');
}
function hidePopup() { $pop.classList.remove('show'); }
window.addEventListener('scroll', hidePopup, true);

function renderTimeline(updates) {
  // links oud → rechts nieuw; updates staan nieuwste-eerst opgeslagen
  const items = [...updates].reverse();
  const track = el('div', {className:'tl-track'}, items.map((u, i) => {
    const b = el('button', {className:'tl-item' + (i === items.length - 1 ? ' latest' : '') + (newUrls.has(u.bron_url) ? ' new' : '')},
      el('span', {className:'tl-dot'}), el('span', {className:'tl-date', textContent:fmtDate(u.gepubliceerd)}));
    b.setAttribute('aria-label', `${fmtDate(u.gepubliceerd)}: ${u.titel || ''}`);
    b.onmouseenter = b.onfocus = () => showPopup(b.querySelector('.tl-dot'), u);
    b.onmouseleave = b.onblur = hidePopup;
    b.onclick = () => openUpdate(u);
    return b;
  }));
  return fade(el('div', {className:'tile timeline'}, track));
}

// Portret, met "Foto zoeken" als er een profiel is maar (nog) geen foto.
function avatarColumn(s) {
  if (!s.profiel || fotoUrl(s)) return avatar(s, 176);
  const btn = el('button', {className:'photo-btn', type:'button', textContent:'Foto zoeken'});
  const msg = el('span', {className:'photo-msg'});
  btn.onclick = async () => {
    btn.disabled = true; btn.textContent = 'Zoeken…'; msg.textContent = '';
    try {
      const res = await api(`/api/stakeholders/${s.id}/photo`, {method:'POST'});
      if (res.gevonden) { await route(); return; }
      msg.textContent = 'Geen openbare foto gevonden.';
    } catch (e) { msg.textContent = e.message; }
    btn.disabled = false; btn.textContent = 'Opnieuw zoeken';
  };
  return el('div', {className:'avatar-col'}, avatar(s, 176), btn, msg);
}

const sectionHead = (title, aside) => el('div', {className:'section-head'}, el('h2', {textContent:title}), aside ? el('span', {className:'meta', textContent:aside}) : null);

async function renderPerson(id) {
  const s = (await api('/api/stakeholders')).find(x => x.id === id);
  if (!s) {
    $view.replaceChildren(el('main', {className:'wrap page'}, el('a', {className:'back', href:'#/', textContent:'← Alle stakeholders'}),
      el('div', {className:'empty', textContent:'Stakeholder niet gevonden.'})));
    return;
  }
  const p = s.profiel;

  const profileBtn = actionButton(p ? 'Profiel bijwerken' : 'Profiel opbouwen', true, 'Profiel wordt opgebouwd… (1-3 min)',
    `Profiel bijgewerkt: ${fmt(s.profiel_bijgewerkt)}`, async () => {
      await api(`/api/stakeholders/${s.id}/profile`, {method:'POST'});
      await route();
    });
  const updatesBtn = actionButton('Zoek updates', false, 'Updates zoeken… (1-3 min)',
    `Laatst gezocht: ${fmt(s.laatst_gezocht)}`, async () => {
      const res = await api(`/api/stakeholders/${s.id}/search`, {method:'POST'});
      res.nieuw.forEach(u => newUrls.add(u.bron_url));
      await route();
    });

  const laatste = s.updates[0];
  const role = (p && p.huidige_functie) ? join(p.huidige_functie.functie, p.huidige_functie.organisatie) : sub(s);
  const notes = [
    s.profiel_toelichting && el('details', {}, el('summary', {textContent:'Toelichting bij het profiel'}), el('p', {textContent:s.profiel_toelichting})),
    s.updates_toelichting && el('details', {}, el('summary', {textContent:'Toelichting bij de updates'}), el('p', {textContent:s.updates_toelichting})),
  ].filter(Boolean);

  let featured = null;
  if (laatste) {
    featured = fade(el('div', {className:'tile featured', tabIndex:0, role:'button'},
      tileHead(laatste.type || 'update', laatste.titel || '(zonder titel)'),
      el('div', {className:'meta', style:'margin-bottom:10px', textContent:fmtDate(laatste.gepubliceerd)}),
      laatste.samenvatting ? el('p', {textContent:laatste.samenvatting}) : null,
      el('div', {className:'more', textContent:'Lees meer →'})));
    featured.onclick = () => openUpdate(laatste);
    featured.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openUpdate(laatste); } };
  }

  $view.replaceChildren(el('main', {className:'wrap page'},
    el('a', {className:'back', href:'#/', textContent:'← Alle stakeholders'}),
    fade(el('section', {className:'card profile-hero'},
      avatarColumn(s),
      el('div', {},
        el('h1', {textContent:s.naam}),
        role ? el('div', {className:'role', textContent:role}) : null,
        p && p.samenvatting ? el('p', {className:'intro', textContent:p.samenvatting}) : null,
        el('div', {className:'hero-actions'}, profileBtn, updatesBtn)))),
    sectionHead('Profiel'),
    el('div', {className:'grid'}, renderProfile(s)),
    sectionHead('Laatste update'),
    featured || fade(el('div', {className:'tile'}, tileHead('Update', 'Nog geen updates'), el('p', {className:'meta', textContent:'Klik op "Zoek updates" om recente openbare updates te laten zoeken.'}))),
    s.updates.length ? sectionHead('Tijdlijn', `${s.updates.length} updates · hover voor preview`) : null,
    s.updates.length ? renderTimeline(s.updates) : null,
    notes.length ? el('section', {className:'notes'}, el('h3', {textContent:'Toelichting van de zoekagent'}), notes) : null,
  ));
}

// -- routing -----------------------------------------------------------------
async function route() {
  delay = 0; hidePopup();
  const m = location.hash.match(/^#\/p\/([\w-]+)$/);
  try { await (m ? renderPerson(m[1]) : renderHome()); }
  catch (e) { $view.replaceChildren(el('main', {className:'wrap page'}, el('div', {className:'error', textContent:e.message}))); }
}
window.addEventListener('hashchange', () => route().then(() => window.scrollTo(0, 0)));
route();
</script>
